<div id="svg-runtime-comparison">
  <style>
    #svg-runtime-comparison .svg-timing-plot { display: block; width: 100%; overflow: visible; }
    #svg-runtime-comparison .svg-timing-plot text { fill: var(--foreground); font-size: 12px; font-family: inherit; }
    #svg-runtime-comparison .svg-timing-plot .timing-value { font-variant-numeric: tabular-nums; font-weight: 500; }
  </style>
  <h3>Full SVG render: mylang vs Zig</h3>
  <div class="text-small text-muted">Original circuit · median of 31 runs · milliseconds · lower is faster</div>
  <svg class="svg-timing-plot" role="img" aria-labelledby="svg-runtime-title svg-runtime-desc">
    <title id="svg-runtime-title">Full SVG rendering time, current implementations</title>
    <desc id="svg-runtime-desc">Zig NetLisp with its process arena: 2.54 milliseconds. Mylang with its managed GC heap: O3 6.00 milliseconds, O3 plus LTO 5.30 milliseconds, O3 with tool limits 11.30 milliseconds, O3 plus LTO with tool limits 10.54 milliseconds. Tool limits mean step and call-depth accounting. Each bar includes process startup through SVG file output and shutdown, excluding compilation.</desc>
  </svg>
  <div class="text-small text-muted">Zig: process arena · mylang: managed GC heap · GC stress excluded from timings</div>
  <script>
    (() => {
      const root = document.getElementById('svg-runtime-comparison');
      const svg = root.querySelector('.svg-timing-plot');
      const ns = 'http://www.w3.org/2000/svg';
      const observations = [
        { label: 'Zig NetLisp · arena', ms: 2.543452, color: 'var(--viz-series-2)' },
        { label: 'mylang · O3', ms: 5.998218, color: 'var(--viz-series-1)' },
        { label: 'mylang · O3 + LTO', ms: 5.304820, color: 'var(--viz-series-1)' },
        { label: 'mylang · O3 + tool limits', ms: 11.295815, color: 'var(--viz-series-1)' },
        { label: 'mylang · O3 + LTO + tool limits', ms: 10.544781, color: 'var(--viz-series-1)' }
      ];
      function element(tag, attributes, content) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        if (content !== undefined) node.textContent = content;
        return node;
      }
      function draw() {
        const width = Math.max(280, Math.floor(root.getBoundingClientRect().width));
        const height = 376;
        const left = 12;
        const right = width - 12;
        const plotTop = 34;
        const plotBottom = 321;
        const longest = Math.max(...observations.map(row => row.ms));
        const maximum = Math.ceil(longest * 1.18 / 2) * 2;
        const scale = value => left + 6 + value / maximum * (right - left - 68);
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.setAttribute('height', height);
        svg.querySelectorAll('g[data-plot]').forEach(node => node.remove());
        const plot = element('g', { 'data-plot': '' });
        svg.appendChild(plot);
        plot.appendChild(element('text', { x: left, y: 22, class: 'axis-title', 'data-axis': 'y' }, 'Build configuration'));
        plot.appendChild(element('rect', {
          x: left, y: plotTop, width: right - left, height: plotBottom - plotTop,
          fill: 'none', stroke: 'var(--border)', 'data-chart-frame': ''
        }));
        for (let i = 0; i <= 3; i += 1) {
          const value = maximum * i / 3;
          const x = scale(value);
          plot.appendChild(element('line', { x1: x, x2: x, y1: plotTop + 1, y2: plotBottom, stroke: 'var(--border)', 'stroke-opacity': '0.5' }));
          plot.appendChild(element('text', { x, y: plotBottom + 20, 'text-anchor': i === 0 ? 'start' : 'middle' }, value.toFixed(1)));
        }
        observations.forEach((row, index) => {
          const y = plotTop + 21 + index * 56;
          const group = element('g', {});
          plot.appendChild(group);
          group.appendChild(element('text', { x: left + 6, y }, row.label));
          group.appendChild(element('rect', {
            x: scale(0), y: y + 8, width: scale(row.ms) - scale(0), height: 19,
            fill: row.color
          }));
          group.appendChild(element('text', { x: scale(row.ms) + 7, y: y + 23, class: 'timing-value' }, `${row.ms.toFixed(2)} ms`));
          group.appendChild(element('rect', {
            x: scale(0), y: y - 9, width: Math.max(44, scale(row.ms) - scale(0)), height: 44,
            fill: 'transparent', 'data-chart-hit': '',
            'data-tooltip': `${row.label}: ${row.ms.toFixed(3)} ms`
          }));
        });
        plot.appendChild(element('text', {
          x: width / 2, y: height - 10, 'text-anchor': 'middle', class: 'axis-title', 'data-axis': 'x'
        }, 'Elapsed time (ms)'));
        // All direct labels have reserved space; check their bounds after layout.
        requestAnimationFrame(() => {
          plot.querySelectorAll('text').forEach(label => {
            const bounds = label.getBBox();
            if (bounds.x + bounds.width > right) {
              label.setAttribute('text-anchor', 'end');
              label.setAttribute('x', right - 4);
            }
          });
        });
      }
      new ResizeObserver(draw).observe(root);
      draw();
    })();
  </script>
</div>
