name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mylang
    strategy:
      matrix:
        mode: [Debug, ReleaseFast]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: mylang
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: eugenepentland/guardian-zig
          ref: 9f32fe87a23ca90ae903fb29572290a7bd5bce84
          path: guardian-zig
      - name: Read pinned toolchain
        id: toolchain
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.toolchain.outputs.version }}
          cache-key: ${{ matrix.mode }}
      - name: Verify exact toolchain
        run: test "$(zig version)" = "$(cat .zigversion)"
      - run: zig build fmt-check
      - run: zig build test -Doptimize=${{ matrix.mode }} --summary all
      - run: zig build -Doptimize=${{ matrix.mode }}
      # Performance reporting only: no approved baseline is consulted yet, so a
      # noisy shared runner cannot fail the build. A required performance status
      # and candidate promotion stay follow-ups per docs/tooling/benchmark-plan.md.
      - name: Benchmark report
        if: matrix.mode == 'ReleaseFast'
        run: |
          zig-out/bin/mylang test examples/benchmarks/main.my \
            --cases examples/benchmarks/cases.json \
            --bench '*' --mode ReleaseFast \
            --bench-warmup 1 --bench-batches 3 \
            --bench-output bench-candidate.json \
            --cache-dir .mylang-cache/bench \
            --qbe zig-out/bin/qbe --zig "$(command -v zig)"
